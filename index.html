<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电气工程师综合计算器（含汽车零件估价）</title>
  <link rel="stylesheet" href="css/styles.css?v=1.4.1" />
</head>
<body>
  <div class="app">
    <!-- 侧边导航 -->
    <aside class="sidebar">
      <div class="brand">
          <span class="brand-badge">EE</span>
        <div>
          <h1>电气工程师计算器</h1>
          <p class="brand-sub">ENGINEERING CALCULATION SUITE</p>
        </div>
      </div>

      <nav id="nav" class="nav">
        <!-- 由 app.js 根据计算器注册表动态生成 -->
      </nav>

      <footer class="sidebar-footer">
        <p class="sidebar-author">Author: Yongshang</p>
        <p>工程版 v1.6.0 · 纯本地计算，数据不出浏览器</p>
      </footer>
    </aside>

    <!-- 主内容区 -->
    <main id="content" class="content">
      <!-- 由 app.js 渲染当前计算器 -->
    </main>
  </div>

  <!-- 核心框架：注册表 / 导航 / 渲染 -->
  <script src="js/app.js?v=1.5"></script>

  <!-- 通用图表渲染器（可复用于各计算器） -->
  <script src="js/chart.js"></script>

  <!-- 各计算器模块（按注册表顺序加载） -->
  <script src="js/calc-relay-fuse.js?v=1.3"></script>
  <script src="js/calc-conductor.js"></script>
  <script src="js/calc-precharge.js"></script>
  <script src="js/calc-bend-radius.js"></script>
  <script src="js/calc-tolerance.js"></script>
  <script src="js/calc-rms-current.js"></script>
  <script src="js/calc-bolt.js"></script>
  <script src="js/calc-iec60664.js"></script>
  <script src="js/calc-iec60664-system.js?v=2.4"></script>
  <script src="js/calc-o-ring.js"></script>
  <script src="js/calc-snapfit.js"></script>
  <script src="js/calc-harness-od.js"></script>
  <script src="js/calc-busbar-temp.js?v=3.2"></script>
  <script src="js/busbar-sample-data.js?v=1.0"></script>
  <script src="js/materials-data.js"></script>
  <script src="js/calc-materials.js?v=2.3"></script>

  <!-- 汽车零件模块化估价：底库、离线Excel导出组件与计算器模块 -->
  <script src="js/vendor/xlsx.min.js"></script>
  <script src="js/estimator-data.js?v=1.0"></script>
  <script src="js/calc-part-estimator.js?v=1.1"></script>

  <!-- SOR 原版 Word 模板生成器：离线压缩、预览、模板数据与表单模块 -->
  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/vendor/docx-preview.min.js"></script>
  <script src="js/sor-template-data.js?v=2.0"></script>
  <script src="js/calc-sor-generator.js?v=2.0"></script>
</body>
</html>
